# ==============================================================================
# Complete Chemical Engineering & Software Systems Portfolio Orchestration
# Services:
#   - PostgreSQL 16 (Relational Timeseries Database - Port 5432)
#   - IndustrialTelemetry.Engine (C# .NET 8 Web API - Port 5100)
#   - ProcessTwin.Py (Python 3.12 Digital Twin + C11 FFI - Port 8000)
#   - ChemFlow.NET (C# .NET 8 Process & Thermodynamics Simulator - Port 5080)
# ==============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: industrial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: industrial_telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d industrial_telemetry"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - portfolio-net

  industrial-telemetry-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: industrial-telemetry-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=industrial_telemetry;Username=postgres;Password=postgres
      - ASPNETCORE_URLS=http://+:5100
      - ASPNETCORE_ENVIRONMENT=Production
      - TelemetryChannel__Capacity=50000
      - TelemetryChannel__BatchSize=1000
      - TelemetryChannel__FlushIntervalMs=50
    ports:
      - "5100:5100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5100/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - portfolio-net

  process-twin:
    build:
      context: ../ProcessTwin.Py
      dockerfile: Dockerfile
    container_name: process-twin
    restart: unless-stopped
    depends_on:
      industrial-telemetry-api:
        condition: service_healthy
      chemflow-api:
        condition: service_healthy
    environment:
      - PROCESS_TWIN_DB=/app/data/processtwin.db
      - PYTHONUNBUFFERED=1
      - TELEMETRY_ENGINE_URL=http://industrial-telemetry-api:5100
      - TELEMETRY_INGESTION_MODE=channel
      - CHEMFLOW_ENGINE_URL=http://chemflow-api:5080
    ports:
      - "8000:8000"
    volumes:
      - twin-data:/app/data
      - ../ReactorCore.C/libreactorcore.so:/usr/local/lib/libreactorcore.so:ro
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/telemetry/current')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  chemflow-api:
    build:
      context: ../ChemFlow.NET
      dockerfile: Dockerfile
    container_name: chemflow-api
    ports:
      - "5080:5080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5080
      - ConnectionStrings__ChemFlowDb=Data Source=/app/data/chemflow.db
      - REACTOR_CORE_LIB_PATH=/usr/local/lib/libreactorcore.so
    volumes:
      - chemflow-data:/app/data
      - ../ReactorCore.C/libreactorcore.so:/usr/local/lib/libreactorcore.so:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5080/api/compounds || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - portfolio-net

volumes:
  pgdata:
  twin-data:
  chemflow-data:

networks:
  portfolio-net:
    name: chemical_software_portfolio_net
    driver: bridge
